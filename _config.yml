title: fra
author: fravaccaro
url: https://fravaccaro.github.io
baseurl: ""
description: >
  just mix life-long passion for everything IT, add genuine curiosity
  and season it with love for facing challenges and finding a way around them.

permalink: /:slug

remote_theme: abhinavs/moonwalk

theme_config:
  appearance: auto
  appearance_toggle: true
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true
  show_projects: true
  show_blog: true
  show_old_projects: false
  show_misc_list: false
  show_reading_time: true
  show_tags: true
  show_code_copy: true
  show_progress_bar: true
  show_back_to_top: true
  show_post_nav: true
  show_toc: true
  home:
    title_projects: Apps
    title_blog: Blog

highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-soopr-seo-tag
  - jekyll-markdown-output
  - jekyll-llms-output

markdown_output:
  collections: [posts]

llms_output:
  index:
    collections: [posts]
  full:
    collections: [posts]
    respect_markdown_output: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.txt
  - funding.yml
  - CHANGELOG.md
